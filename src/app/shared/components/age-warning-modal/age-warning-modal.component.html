@if (isOpen()) {
  <div class="age-warning">
    <div class="age-warning__overlay" (click)="onCancelar()"></div>

    <div class="age-warning__dialog">
      <header class="age-warning__header">
        <div class="age-warning__icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        <h1 class="age-warning__title">¡ADVERTENCIA! (+{{ restriccionEdad() }})</h1>
      </header>

      <div class="age-warning__body">
        <p class="age-warning__message" [class.age-warning__message--error]="esMenorRegistrado()">
          Esta película es apta para mayores de {{ restriccionEdad() }} años.
          <strong>Si eres menor de edad, deberás concurrir acompañado por un mayor de edad.</strong>
        </p>
      </div>

      <footer class="age-warning__actions">
        <button class="age-warning__btn age-warning__btn--secondary" (click)="onCancelar()">
          {{ esMenorRegistrado() ? 'Entendido' : 'Cancelar' }}
        </button>

        @if (!esMenorRegistrado()) {
          <button class="age-warning__btn age-warning__btn--primary" (click)="onConfirmar()">
            Continuar compra
          </button>
        }
      </footer>
    </div>
  </div>
}
