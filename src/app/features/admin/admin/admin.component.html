<div class="profile-layout">
  <!-- Tarjeta Lateral Izquierda (Idéntica al panel de cliente) -->
  <aside class="profile-sidebar">
    <div class="user-info">
      <div class="avatar-circle">
        <span>{{ inicial() }}</span>
      </div>
      <h3 class="user-name">{{ nombreUsuario() }}</h3>
      <p class="user-email">{{ emailUsuario() }}</p>
    </div>

    <nav class="profile-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        Gestión y Funciones
      </a>
      <a routerLink="/admin/validar" routerLinkActive="active">
        Validar QRs / PINs
      </a>
      <a routerLink="/admin/reportes" routerLinkActive="active">
        Reportes y Estadísticas
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </aside>

  <!-- Contenido Principal a la Derecha (Envuelto en la tarjeta oscura) -->
  <main class="profile-content">
    <router-outlet></router-outlet>
  </main>
</div>
