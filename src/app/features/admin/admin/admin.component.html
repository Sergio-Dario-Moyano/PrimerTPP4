<div class="profile-layout">
  <!-- Tarjeta Lateral Izquierda (Idéntica al panel de cliente) -->
  <aside class="profile-sidebar">
    <div class="user-info">
      <div class="avatar-circle">
        <span>{{ inicial() }}</span>
      </div>
      <h3 class="user-name">{{ nombreUsuario() }}</h3>
      <p class="user-email">{{ emailUsuario() }}</p>
      @if (nombreRol()) { <p class="user-email">Rol: <strong>{{ nombreRol() }}</strong></p> }
    </div>

    <nav class="profile-nav">
      @for (seccion of secciones(); track seccion.ruta) {
        <a [routerLink]="seccion.ruta" routerLinkActive="active">{{ seccion.icono }} {{ seccion.titulo }}</a>
      }
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </aside>

  <!-- Contenido Principal a la Derecha (Envuelto en la tarjeta oscura) -->
  <main class="profile-content">
    <router-outlet></router-outlet>
  </main>
</div>
