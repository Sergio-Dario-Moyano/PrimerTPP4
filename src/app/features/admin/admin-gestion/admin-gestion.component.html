<div class="admin-container">
  <h2>Panel de Administración - CineLanús</h2>

  <!-- FORMULARIO DE PELÍCULA -->
  <form [formGroup]="peliculaForm" (ngSubmit)="guardarPelicula()" class="admin-form">
    <h3>Nueva Película en Cartelera</h3>

    <div class="form-group">
      <label>Título de la Película:</label>
      <input type="text" formControlName="titulo" placeholder="Ej. Interstellar">
    </div>

    <div class="form-group">
      <label>Sinopsis:</label>
      <textarea formControlName="sinopsis" placeholder="Descripción de la película..."></textarea>
    </div>

    <!-- SECCIÓN DE GÉNEROS -->
    <div class="form-group">
      <label>Géneros de la Película:</label>
      <div class="generos-grid">
        @for (genero of generosDisponibles(); track genero.id) {
          <button
            type="button"
            class="genero-chip"
            [class.selected]="generosSeleccionados().includes(genero.id)"
            (click)="toggleGenero(genero.id)">
            {{ genero.nombre }}
          </button>
        }
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Duración (minutos):</label>
        <input type="number" formControlName="duracion_minutos" placeholder="120">
      </div>
      <div class="form-group">
        <label>Restricción de Edad:</label>
        <select formControlName="restriccion_edad">
          <option [value]="0">ATP (Apta para todo público)</option>
          <option [value]="13">+13 años</option>
          <option [value]="16">+16 años</option>
          <option [value]="18">+18 años</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>URL del Póster:</label>
        <input type="text" formControlName="url_imagen" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>URL del Banner (Hero):</label>
        <input type="text" formControlName="hero_imagen" placeholder="https://...">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Precio Base ($):</label>
        <input type="number" formControlName="precio_base" placeholder="5000">
      </div>
      <div class="form-group">
        <label>Estado:</label>
        <select formControlName="estado">
          <option value="cartelera">Cartelera</option>
          <option value="proximamente">Próximamente</option>
          <option value="archivada">Archivada</option>
        </select>
      </div>
    </div>

    <button
      type="submit"
      appAdminAccion
      [tipoAccion]="'pelicula'"
      [disabled]="cargando()">
      @if (cargando()) { Guardando... } @else { Registrar Película }
    </button>
  </form>

  @if (mensajeExito()) {
    <div class="alert success">{{ mensajeExito() }}</div>
  }

  @if (mensajeError()) {
    <div class="alert error">{{ mensajeError() }}</div>
  }
</div>
